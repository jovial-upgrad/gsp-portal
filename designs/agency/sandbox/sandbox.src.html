<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GSP Commissions Sandbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* Layout: a ledger workbench. Sticky header with the sandbox clock and tabs; each tab is one working surface. */
:root{
  --bg:#f5f6f3;--panel:#ffffff;--sunk:#eceee8;--line:#d9dcd3;--ink:#1d2421;--mute:#5e6862;--faint:#8a938d;
  --acc:#24527a;--acc-soft:#e3ecf4;--acc-ink:#ffffff;
  --good:#1f7a4d;--good-soft:#e2f2e9;--warn:#9a6200;--warn-soft:#fbf0d9;--bad:#b3261e;--bad-soft:#fbe5e3;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--f-head:"IBM Plex Serif",Georgia,serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917;--panel:#1b211f;--sunk:#222a27;--line:#323b37;--ink:#e6ebe7;--mute:#a3ada7;--faint:#76807a;
  --acc:#8db8e0;--acc-soft:#1f3243;--acc-ink:#0f1a24;
  --good:#6fcf9a;--good-soft:#173326;--warn:#e8b45a;--warn-soft:#382b12;--bad:#f08a80;--bad-soft:#3d1c19;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917;--panel:#1b211f;--sunk:#222a27;--line:#323b37;--ink:#e6ebe7;--mute:#a3ada7;--faint:#76807a;
  --acc:#8db8e0;--acc-soft:#1f3243;--acc-ink:#0f1a24;
  --good:#6fcf9a;--good-soft:#173326;--warn:#e8b45a;--warn-soft:#382b12;--bad:#f08a80;--bad-soft:#3d1c19;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-sans);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1360px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px 0}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font:600 19px/1.2 var(--f-head);margin:0;letter-spacing:.01em}
.brand span{color:var(--mute);font-size:12.5px}
.clock{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px}
.clock label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--mute);font:500 14px var(--f-sans);padding:9px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--acc);font-weight:600}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}
.tab .n.w{background:var(--warn)}
main{padding-block:20px 60px}
h2{font:600 18px/1.3 var(--f-head);margin:0 0 4px}
h3{font:600 15px/1.3 var(--f-sans);margin:0 0 8px}
p{margin:0 0 10px}
.lead{color:var(--mute);max-width:75ch;margin-bottom:16px}
.meter{color:var(--mute);font-size:12.5px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0;max-width:100%}
textarea{width:100%;min-height:70px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.d{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{appearance:none;border:0;background:none;color:var(--acc);padding:0;cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel+.panel{margin-top:14px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:600;background:var(--sunk)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-acc{background:var(--acc-soft);color:var(--acc)}.p-mute{background:var(--sunk);color:var(--mute);border-color:var(--line)}
.applist{display:grid;gap:4px;max-height:70vh;overflow:auto;margin-top:10px}
.appi{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:6px;padding:7px 9px;cursor:pointer}
.appi:hover{background:var(--sunk)}
.appi[aria-current="true"]{background:var(--acc-soft);border-color:var(--acc)}
.appi b{display:block;font-weight:600}
.appi small{color:var(--mute)}
.grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;margin:10px 0 2px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 16px;margin:12px 0}
.facts dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600}
.facts dd{margin:0;font-weight:500}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.step{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.step.done{background:var(--good-soft);border-color:transparent;color:var(--good);font-weight:600}
.step.now{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
details.why{margin-top:4px}
details.why summary{cursor:pointer;color:var(--acc);font-size:12.5px;font-weight:500}
.whybox{background:var(--sunk);border-radius:6px;padding:8px 10px;margin-top:6px;font-size:12.5px}
.whybox ol{margin:0;padding-left:18px}
.whybox li{margin:2px 0}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:13px}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.info{border-color:var(--acc);background:var(--acc-soft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600}
.kpi b{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(720px,100%);padding:18px 18px 16px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal.wide{width:min(980px,100%)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 14px;margin:12px 0}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--mute)}
.form label input,.form label select,.form label textarea{font-weight:400;color:var(--ink);width:100%}
.form label small{font-weight:400;color:var(--faint)}
.chk{display:flex!important;align-items:center;gap:8px;grid-template-columns:none!important}
.chk input{width:auto!important}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;font-weight:500;max-width:calc(100% - 32px)}
.diff-up{color:var(--good);font-weight:600}.diff-down{color:var(--bad);font-weight:600}
.neg{color:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--mute)}
.rules ol{padding-left:20px;max-width:80ch}
.rules li{margin:6px 0}
.rules h3{margin-top:18px}
.status-line{font-size:12.5px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* The portal's own controls (no system UI): select menus, a calendar, ticks, number fields */
.sel{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0;max-width:100%;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.sel:hover{border-color:var(--faint)}
.sel .sel-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sel .sel-c{color:var(--mute);font-size:11px;flex:none}
.sel[aria-expanded="true"]{border-color:var(--acc)}
.pop{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:4px;max-height:340px;overflow:auto;max-width:calc(100vw - 16px)}
.pop .opt{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 9px;border-radius:5px;cursor:pointer;font:inherit;color:var(--ink);white-space:normal}
.pop .opt:hover,.pop .opt[data-active="true"]{background:var(--sunk)}
.pop .opt[aria-selected="true"]{font-weight:600;color:var(--acc)}
.pop input.search{width:100%;margin-bottom:4px}
.datef{display:inline-flex;align-items:stretch;max-width:100%}
.datef input{border-top-right-radius:0;border-bottom-right-radius:0;width:122px;min-width:0}
.datef input.bad,input.bad,textarea.bad{border-color:var(--bad)}
.datef .calb{border:1px solid var(--line);border-left:0;background:var(--sunk);border-radius:0 6px 6px 0;padding:0 8px;cursor:pointer;color:var(--mute);display:grid;place-items:center}
.datef .calb svg{width:15px;height:15px}
.cal{padding:8px;width:262px}
.cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:600;gap:6px}
.cal .ch button{border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer;padding:2px 9px;color:var(--ink);font:inherit}
.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .cg span{font-size:11px;color:var(--faint);text-align:center;padding:2px 0}
.cal .cg button{border:0;background:none;padding:5px 0;border-radius:5px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
.cal .cg button:hover{background:var(--sunk)}
.cal .cg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.cal .cg button.out{color:var(--faint)}
.cal .cf{display:flex;justify-content:space-between;margin-top:6px}
.tick{display:inline-flex;align-items:flex-start;gap:8px;border:0;background:none;padding:2px 0;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.tick .box{width:16px;height:16px;margin-top:2px;border:1.5px solid var(--faint);border-radius:4px;display:inline-grid;place-items:center;flex:none;background:var(--panel)}
.tick[aria-checked="true"] .box{background:var(--acc);border-color:var(--acc)}
.tick[aria-checked="true"] .box::after{content:"";width:8px;height:4px;border-left:2px solid var(--acc-ink);border-bottom:2px solid var(--acc-ink);transform:translateY(-1px) rotate(-45deg)}
.form label .sel,.form label .datef,.form .fld .sel{width:100%}
.form label .datef input{flex:1;width:auto}
.form .fld{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--mute);align-content:start}
.form label{align-content:start}
.form .fld .sel,.form .fld .tick,.form .fld .datef input{font-weight:400;color:var(--ink)}
.form .fld small,.form label small{font-weight:400;color:var(--faint)}
.form .err{color:var(--bad);font-weight:500}
.edit-err:empty{display:none}
.edit-err{margin:8px 0;padding:10px 12px;border:1px solid var(--bad);border-left-width:4px;border-radius:8px;background:color-mix(in srgb,var(--bad) 8%,#fff);color:var(--bad);font-weight:600;font-size:13px;line-height:1.45}
.form .is-bad textarea,.form .is-bad input{border-color:var(--bad)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent)}
.form .is-bad{color:var(--bad)}
/* How it's worked out */
.how ol{margin:0;padding-left:20px}
.how li{margin:5px 0;line-height:1.45}
.how li b{font-weight:600;color:var(--ink)}
.ref{display:inline-block;font:600 10.5px/1.6 var(--f-mono);padding:0 5px;border-radius:4px;background:var(--acc-soft);color:var(--acc);margin-left:6px;white-space:nowrap}
/* Scenarios */
.casebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,104px));z-index:4;background:var(--acc-soft);border-bottom:1px solid var(--acc);color:var(--ink)}
.casebar .wrap{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding-block:8px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;min-width:0}
.scard.fail{border-color:var(--bad)}
.scard h3{font:600 16px/1.3 var(--f-head);margin:0}
.scard .sid{font:600 12px var(--f-mono);color:var(--mute)}
.scard blockquote{margin:8px 0 10px;padding:8px 12px;border-left:3px solid var(--line);background:var(--sunk);border-radius:0 6px 6px 0;font-size:13px;white-space:pre-line}
.scard ul{margin:4px 0 10px;padding-left:20px}
.scard li{margin:2px 0}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.sgrid{grid-template-columns:minmax(0,1fr)}}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}
td.calc{color:var(--mute);font-family:var(--f-mono);font-size:12px}
.ltype{display:inline-block;margin-left:6px}
</style>
</head>

<script>
/*@@BASELINE@@*/
/*@@ENGINE@@*/
const {compute,buildRun,thursdayOf,addDays,addMonths,fxRate,windowKey,nice,money,r2,LEVELS,TRIG,DEST,bandTxt,winName,winLabel,DEFYEARS,PAY,PAYNAME,CHARGENAME,DEF_REGION_GROUPS,rowLabel,monthName,SCENARIOS,runAll,runScenario}=GSPE;
const pdx=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));};
const fdx=d=>d.toISOString().slice(0,10);
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(pdx(s))&&fdx(pdx(s))===s;
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ===== UI ===== */
const $=s=>document.querySelector(s);

  const close=()=>{closePop();o.remove();document.removeEventListener('keydown',esc);};const esc=e=>{if(e.key==='Escape'&&!POP)close();};document.addEventListener('keydown',esc);return close;}

/* ---- the portal's own controls ---- */
let POP=null;
function closePop(){if(!POP)return;const p=POP;POP=null;p.el.remove();document.removeEventListener('mousedown',p.out,true);document.removeEventListener('keydown',p.key,true);window.removeEventListener('resize',closePop);p.btn&&p.btn.setAttribute('aria-expanded','false');}

  let left=Math.max(8,Math.min(r.left,window.innerWidth-w-8));let top=r.bottom+4;if(top+hh>window.innerHeight-8&&r.top-hh-4>8)top=r.top-hh-4;el.style.left=left+'px';el.style.top=top+'px';el.style.visibility='';
  const out=e=>{if(!el.contains(e.target)&&!btn.contains(e.target))closePop();};const k=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closePop();btn.focus();}else if(e.key==='Tab'){closePop();}else if(key)key(e);};
  document.addEventListener('mousedown',out,true);document.addEventListener('keydown',k,true);window.addEventListener('resize',closePop);POP={el,out,key:k,btn};btn.setAttribute('aria-expanded','true');}
/* SelectMenu: a button that opens a list (a search box over lists of more than ten) */
function sel(o){const opts=o.options.map(x=>Array.isArray(x)?x:[x,String(x)]);const lab=v=>{const f=opts.find(x=>String(x[0])===String(v));return f?f[1]:(o.placeholder||'Choose…');};
  let val=o.value==null?'':o.value;const t=h('span',{class:'sel-t'},lab(val));
  const b=h('button',{type:'button',class:'sel'+(o.cls?' '+o.cls:''),id:o.id||null,'aria-haspopup':'listbox','aria-expanded':'false','aria-label':o.label||null,style:o.style||null},t,h('span',{class:'sel-c','aria-hidden':'true'},'▾'));

  b.addEventListener('keydown',e=>{if((e.key==='ArrowDown'||e.key==='ArrowUp')&&!POP){e.preventDefault();open();}});
  function open(){const pop=h('div',{class:'pop'});const list=h('div',{role:'listbox','aria-label':o.label||'Options'});let q='';

  m.append(h('div',{class:'rules panel'},h('h2',{},'How the engine works'),h('p',{class:'lead'},'The rules the sandbox applies, in plain language, with Finance’s answers of 30 Oct 2026 and the commissions team’s scenarios of 2 Nov 2026. Choices the sheet and the slice 5 PRD don’t settle are marked Proposal. The same engine runs the GSP portal.'),
    ...sec('University side (what GSP earns)',['Each university’s terms are versioned: an enrolment uses the version in force on its intake start (S5-2). An intake before the agreement starts or after it ends is held.','The base is the application’s final tuition fee (first year, after any scholarship, as the CoE shows it). A university that pays on the gross fee adds the scholarship on the application back.',
      'The rate comes from the level (sector) table, or from a rate row keyed by any mix of level, course, campus, student region (a country or a region group such as SEA) and study period. The row that names the most of them wins.',P('Two equally specific rows: the first listed wins, and the exception list flags it.'),
      'Commission is paid once a year, each semester, trimester or term, per unit, or on each fee payment, and is chargeable for the whole course, a number of years, semesters, terms or units, or the fees paid up to a limit. Each period has its own date (the application’s census date for it when it holds one) and its own fee (the year’s fee on the application; the first year’s when it holds none, flagged).',
      'A line becomes due on the commission trigger: the census date for most Australian universities; if no census date is known, start + '+S.fallbackWeeks+' weeks.',
      'University tiers count GSP students by intake (never the census month), per calendar year, academic year (its own start month), financial year or intake, per university or across a university group. Every member of a group counts toward the group, with or without a tier of its own.',P('A college tier and a group tier on the same student: the higher rate wins; they do not stack.'),P('A tier replaces the level rate; against a more specific rate row (course, campus, region, period) the higher of the two wins.'),
      'Retrospective tiers: each student’s line stays at the band they had when they enrolled. When later students move the band up, the difference for every earlier student is a separate tier top-up line, dated when the higher band was reached, which GSP invoices to the university. The RP’s matching top-up is paid only once GSP has received it.',
      'University promotions match on the intake start and can be by region, intake or academic year, course or sector, level or campus. A promotion either wins when it is higher, replaces the rate, or adds an additional commission line.',P('Additional commission is shared with the RP at its rate; bonuses (per band, per student, or once N students enrol) are GSP’s alone.'),
      'Each university pays in its own currency; the AUD view uses the week’s rate for the trigger date. Australian universities are invoiced with '+S.auGst+'% GST; others without. Amounts are rounded half up to the cent after every step (S5-9).']),
    ...sec('RP side (what GSP pays)',['RP commission is a % of GSP’s line from the university. University bonuses are not shared.','Which terms apply is decided by the intake start: the scheme, own rate or notice in force then.',
      'Special lead: when GSP gave the RP a qualified lead AND the RP provided an enrolment-ready application, the RP gets a flat '+S.gspLeadPct+'% and nothing else applies; the student does not count toward the RP’s tier. A GSP lead that is not enrolment-ready gets the RP’s standard terms and is flagged.',
      'Otherwise a notice that covers the enrolment applies; a notice listing the RP by ID beats a region-wide one.',P('Two notices of the same kind cover one enrolment: the higher rate wins.'),'Notices match the RP’s sales region (region groups such as SEA work), the intake (dates, or named intakes such as July 2026), destinations, universities and levels.',
      'Most notices are a separate box: their enrolments do not count toward the RP’s standard tier. A notice can instead be “highest wins” or “adds on”.',P('Adds on stops at '+(S.rpCap==null?100:S.rpCap)+'% of GSP’s line: an RP is never paid more than GSP earns on the line.'),'A notice can pay a % of the student’s tuition fee, on top of the RP’s share (or instead of it, as a box), once GSP has been paid.',
      'An RP’s tier counts all its branches together, by intake, and only students GSP has received commission for.','Retrospective: when a higher band is reached, earlier students in the window are topped up. Prospective (the default when a document is silent): only new students get the higher rate.',
      'A withdrawal with a refund does not drop the band at once: the tier is re-worked at the end of the period (Finance’s assumption, S5-15), and the RP page says a rework is pending.',
      'Milestone bonuses are due once GSP has been paid for the required number of enrolments, even after the notice ends.','After year 1: '+annTxt(S)+'. An RP can have its own rate. Lines after year 1 do not count toward tiers or milestones. (Finance to confirm.)']),
    ...sec('Paying RPs',['An RP is paid only after GSP receives the university’s money, and only its share of what GSP has received.','Payout runs happen every Thursday. All conversion goes through AUD with the week’s rates (for example GBP × the GBP rate = AUD, ÷ the INR rate = INR); fixed AUD amounts are paid in AUD.','Australian bank accounts are paid in one batch, local accounts in another.','GST-registered RPs get '+S.rpGst+'% GST added. Tax withheld: '+(Object.entries(S.wht||{}).map(([k,v])=>k+' '+v+'%').join(', ')||'none')+'.','An RP mapped to a Master Partner is paid through it, on the Master Partner’s own terms; its tier counts all its RPs together.','GSP creates each RP’s invoice from the payout run; the RP approves or disputes it. Only approved invoices are paid.','A run is held if a needed FX rate is missing for the week.']),
    ...sec('Corrections',['A withdrawal before a line’s trigger date means nothing is payable for it.','After a refund, the university recovers its commission and GSP recovers the RP’s share from later payouts. The credit shows on the original student.','Not recovered within '+S.legalDays+' days: forwarded to Legal.','Anyone in Finance can override an amount with confirmation; it is logged.']),
    ...sec('Controls',['A change to terms or settings goes live as soon as it is saved, and is written to the activity log.','Every payout run is prepared by one person and approved by another.','Exceptions are worked within 2 working days.'])));}

/* ---- boot ---- */
async function boot(){const hsh=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===hsh))UI.tab=hsh;window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(TABS.some(t=>t[0]===k)&&k!==UI.tab){UI.tab=k;render();}});render();
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null;}catch(e){db=null;}
  try{USER=window.claude&&window.claude.use?await window.claude.use('user'):null;if(USER){const me=await USER.me();ST.me={id:me&&me.id||null,name:me&&me.name||'You'};if(me&&me.id&&me.name)ST.names[me.id]=me.name;}}catch(e){}
  if(!db){ST.mode='local';ST.cfg=JSON.parse(JSON.stringify(BASELINE));render();return;}
  let canWrite=null;try{canWrite=USER&&USER.can?await USER.can('data.write'):null;}catch(e){canWrite=null;}
  const mapCfg=s=>{const c={};s.docs.forEach(d=>{c[d.id]=d.data();});const cfg=c.unis&&c.schemes&&c.notices&&c.rps&&c.settings?{unis:c.unis.rows,schemes:c.schemes.rows,notices:c.notices.rows,rps:c.rps.rows,groups:c.groups?c.groups.rows:(BASELINE.groups||[]),settings:c.settings.data}:null;return {cfg,clock:c.clock?c.clock.date:null};};
  if(canWrite===false){let got={cfg:false,apps:false},u1=null,u2=null;const done=()=>{if(!got.cfg||!got.apps)return;try{u1&&u1();u2&&u2();}catch(e){}DB=null;ST.mode='local';ST.viewOnly=true;if(!ST.cfg)ST.cfg=JSON.parse(JSON.stringify(BASELINE));render();};
    u1=db.collection('cfg').onSnapshot(s=>{const r=mapCfg(s);ST.cfg=r.cfg;ST.clock=r.clock;got.cfg=true;done();},()=>{got.cfg=true;done();});
    u2=db.collection('apps').onSnapshot(s=>{ST.apps={};s.docs.forEach(d=>ST.apps[d.id]=d.data());got.apps=true;done();},()=>{got.apps=true;done();});return;}
  DB=db;let first={cfg:false,apps:false};const ready=()=>{if(first.cfg&&first.apps&&ST.mode==='loading'){ST.mode='db';}render();};
  const fail=e=>{if(e&&(e.code==='revoked'||e.code==='not_granted')){DB=null;ST.mode='local';if(!ST.cfg)ST.cfg=JSON.parse(JSON.stringify(BASELINE));render();}};
  db.collection('cfg').onSnapshot(s=>{const c={};s.docs.forEach(d=>{c[d.id]=d.data();});const T=tgt();if(c.unis&&c.schemes&&c.notices&&c.rps&&c.settings)T.cfg={unis:c.unis.rows,schemes:c.schemes.rows,notices:c.notices.rows,rps:c.rps.rows,groups:c.groups?c.groups.rows:(BASELINE.groups||[]),settings:c.settings.data};else T.cfg=null;T.clock=c.clock?c.clock.date:null;first.cfg=true;ready();},fail);
  db.collection('apps').onSnapshot(s=>{const T=tgt();T.apps={};s.docs.forEach(d=>T.apps[d.id]=d.data());first.apps=true;ready();},fail);
  db.collection('checks').onSnapshot(s=>{const T=tgt();T.checks={};s.docs.forEach(d=>T.checks[d.id]=d.data());render();},fail);
  db.collection('runs').onSnapshot(s=>{const T=tgt();T.runs={};s.docs.forEach(d=>T.runs[d.id]=d.data());render();},fail);
  db.collection('log').orderBy('at','desc').limit(60).onSnapshot(s=>{const T=tgt();T.log={};s.docs.forEach(d=>T.log[d.id]=d.data());render();},fail);}
let _rt=null;const _render=render;render=function(){if(_rt)return;_rt=requestAnimationFrame(()=>{_rt=null;const y=window.scrollY;const fe=document.activeElement&&document.activeElement.id;_render();if(fe){const el=document.getElementById(fe);if(el&&el.focus)el.focus({preventScroll:true});}window.scrollTo(0,UI.top?0:y);UI.top=false;});};
boot();
</script>
