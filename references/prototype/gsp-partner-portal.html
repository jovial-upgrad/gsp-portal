<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
</style></head><body>
<title>GSP Partner Portal (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column (max 880px), a single top bar, one thing to do per screen. Owner colours carry meaning: you = amber, GSP = violet, university = blue. */
:root{
  --bg:#f6f7f5; --surface:#ffffff; --ink:#17201b; --muted:#5e6a63; --line:#e3e7e3; --soft:#eef1ee;
  --accent:#1f5c47; --accent-ink:#ffffff; --accent-soft:#e3efe9;
  --you:#b06a00; --you-soft:#fdf1dc; --gsp:#5b4bc4; --gsp-soft:#ecebfb; --uni:#1f63a8; --uni-soft:#e4eef9;
  --good:#1d7a4a; --good-soft:#e1f3e8; --warn:#a4570a; --bad:#b3261e; --bad-soft:#fbe7e5;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#181f1b; --ink:#e8ede9; --muted:#9aa69f; --line:#28322c; --soft:#1e2621;
  --accent:#6cc39c; --accent-ink:#0d1a14; --accent-soft:#1d3329;
  --you:#f0b453; --you-soft:#33270f; --gsp:#a99ef5; --gsp-soft:#25213f; --uni:#7fb3ea; --uni-soft:#172738;
  --good:#6fd29b; --good-soft:#163024; --warn:#f0b453; --bad:#f28b82; --bad-soft:#3a1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#181f1b; --ink:#e8ede9; --muted:#9aa69f; --line:#28322c; --soft:#1e2621;
  --accent:#6cc39c; --accent-ink:#0d1a14; --accent-soft:#1d3329;
  --you:#f0b453; --you-soft:#33270f; --gsp:#a99ef5; --gsp-soft:#25213f; --uni:#7fb3ea; --uni-soft:#172738;
  --good:#6fd29b; --good-soft:#163024; --warn:#f0b453; --bad:#f28b82; --bad-soft:#3a1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto;padding-block:0 110px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:650;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:inline-block}
nav{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600;cursor:pointer}
.tab[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tab:hover{color:var(--ink)}
.spacer{flex:1}
.who{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.who select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px}
/* type */
h1{font-family:var(--display);font-weight:650;font-size:clamp(24px,3.4vw,30px);letter-spacing:-.015em;line-height:1.15;margin:28px 0 4px;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0 0 12px;letter-spacing:-.005em}
.lead{color:var(--muted);margin:0 0 20px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-you{color:var(--you);background:var(--you-soft)} .c-gsp{color:var(--gsp);background:var(--gsp-soft)} .c-uni{color:var(--uni);background:var(--uni-soft)} .c-done{color:var(--good);background:var(--good-soft)} .c-end{color:var(--muted);background:var(--soft)}
/* segmented */
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.segb{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.segb .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.segb[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.segb[aria-pressed="true"] .n{color:inherit;opacity:.75}
/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:16px 18px;border-top:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:var(--soft)}
.row .t{font-weight:700;min-width:0}
.row .s{color:var(--muted);font-size:14px;min-width:0}
.row .now{grid-column:1/-1;font-size:14px;min-width:0}
.row .when{font-size:12.5px;color:var(--muted);text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* application */
.back{border:0;background:none;color:var(--muted);cursor:pointer;padding:0;margin-top:24px;font-weight:600}
.back:hover{color:var(--ink)}
.status{margin:18px 0 8px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.status .big{font-family:var(--display);font-size:clamp(22px,3vw,27px);font-weight:500;line-height:1.2;flex:1;min-width:240px;text-wrap:balance}
.stages{display:flex;gap:4px;margin:14px 0 6px}
.stages span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.stages span.d{background:var(--accent)} .stages span.n{background:var(--accent);opacity:.45}
.stagecap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:22px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.need{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.need:first-of-type{border-top:0}
.need .x{flex:1;min-width:0}
.need .x small{display:block;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.p:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;cursor:default}
.ok{color:var(--good);font-weight:600;font-size:14px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:8px 0;font-size:14px;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl time{color:var(--muted);font-size:12.5px;padding-top:1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.link{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:14px}
/* chat drawer */
.drawer{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 48px rgba(0,0,0,.18);display:flex;flex-direction:column;max-height:min(520px,75vh);z-index:20}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.msgs{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px;flex:1}
.m{max-width:85%;padding:9px 12px;border-radius:12px;font-size:14px}
.m.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.m.them{align-self:flex-start;background:var(--soft)}
.m small{display:block;font-size:11.5px;opacity:.75;font-weight:600}
.chatin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chatin input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px}
.ask{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:999px;padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
/* search */
.searchbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.searchbar input{flex:1 1 260px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.searchbar select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.course h3{margin:0;font-size:16px;line-height:1.3}
.course .u{color:var(--muted);font-size:14px;margin:2px 0 10px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13.5px;margin-bottom:10px}
.facts b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.elig{font-size:13px;font-weight:600;margin-bottom:12px}
.elig.y{color:var(--good)} .elig.n{color:var(--warn)}
.course .acts{display:flex;gap:8px}
.ccard .acts{display:flex;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ccard .elig2{margin-top:4px}
.ccard .cfacts{margin-bottom:14px}
/* earnings */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:16px}
@media (max-width:600px){.tiles{grid-template-columns:1fr}}
.tile .v{font-family:var(--display);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.tile .h{font-size:13px;color:var(--muted)}
.tier{margin-bottom:16px}
.bar{height:10px;border-radius:6px;background:var(--soft);position:relative;overflow:hidden;margin:10px 0 6px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px}
.ticks{position:relative;height:18px;font-size:12.5px;color:var(--muted)}
.ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:0 12px 8px}
td{padding:12px;border-top:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}
/* admissions */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px;margin-bottom:18px}
.q{text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px}
.q .v{font-family:var(--display);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.q .h{font-size:13px;color:var(--muted)}
.q[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.evid{background:var(--soft);border-radius:10px;padding:12px;font-size:14px;margin:10px 0}
.evid b{font-weight:700}
.meter{font-size:13px;color:var(--muted)}
/* owner tiles */
.otiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 10px}
@media (max-width:560px){.otiles{grid-template-columns:1fr}}
.ot{border:2px solid transparent;border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ot .v{font-family:var(--display);font-size:30px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.ot .h{font-weight:600;font-size:14px}
.ot.you{background:var(--you-soft);color:var(--you)} .ot.gsp{background:var(--gsp-soft);color:var(--gsp)} .ot.uni{background:var(--uni-soft);color:var(--uni)}
.ot[aria-pressed="true"]{border-color:currentColor}
.ot .h{color:var(--ink)}
.allrow{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;gap:12px;flex-wrap:wrap}
.banner{border-radius:14px;padding:16px 18px;margin:18px 0 6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.you{background:var(--you-soft)} .banner.gsp{background:var(--gsp-soft)} .banner.uni{background:var(--uni-soft)} .banner.done{background:var(--good-soft)}
.banner .big{font-family:var(--display);font-size:clamp(20px,2.8vw,25px);font-weight:500;line-height:1.2;flex:1;min-width:220px;text-wrap:balance}
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:14px 0 4px}
.steps div{font-size:11.5px;color:var(--muted);text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps div::before{content:"";display:block;height:5px;border-radius:3px;background:var(--line);margin-bottom:6px}
.steps div.d::before{background:var(--accent)} .steps div.n{color:var(--ink);font-weight:700} .steps div.n::before{background:var(--accent)}
@media (max-width:560px){.steps div{font-size:0}.steps div.n{font-size:11.5px;overflow:visible}}
.modal{position:fixed;inset:0;background:rgba(10,20,15,.42);z-index:25;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:16px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px}
.field{display:grid;gap:6px;margin-bottom:14px;align-content:start}
.field > input,.field > select,.field > div{align-self:start}
.field input:not([type=checkbox]):not([type=radio]):not([type=file]),.field select{box-sizing:border-box;height:44px}
.field label{font-weight:600;font-size:14px}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.sugg{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sugg button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 12px;cursor:pointer}
.sugg button:first-child{border-top:0}
.sugg button:hover,.sugg button[aria-pressed="true"]{background:var(--accent-soft)}
.fit{border-radius:10px;padding:12px;font-size:14px;margin-bottom:14px;background:var(--soft)}
.fit ul{margin:6px 0 0;padding-left:18px}
.fit .g{color:var(--good)} .fit .w{color:var(--warn)}
.newbtn{margin-left:auto}
.stabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.stab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.stab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.dot{width:18px;height:18px;border-radius:50%;background:var(--you);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center;font-size:14px}
.frow:first-child{border-top:0}
.frow .k{color:var(--muted)}
.frow.miss .k{color:var(--ink);font-weight:600}
.frow input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.chipf{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chipf[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.linkh{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
.linkh:hover{color:var(--accent);text-decoration:underline}
.cmp{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer}
.pdf{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
.bellb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;cursor:pointer;display:flex;gap:4px;align-items:center}
.bn{background:var(--you);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:0 6px}
.bellp{position:absolute;right:0;top:40px;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.16);z-index:12;overflow:hidden}
.bi{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 14px;cursor:pointer;font-size:14px}
.bi:hover{background:var(--soft)}
.due{display:flex;gap:12px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;cursor:pointer;text-align:left;font-size:14px;flex-wrap:wrap}
.due:first-of-type{border-top:0}
.fun{display:grid;grid-template-columns:110px 1fr 120px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.fun .v{text-align:right;color:var(--muted)}
.bar2{height:14px;background:var(--soft);border-radius:7px;overflow:hidden;display:block}
.bar2 i{display:block;height:100%;background:var(--accent);border-radius:7px}
@media (max-width:560px){.fun{grid-template-columns:90px 1fr 92px}}
.lx-bad{color:var(--bad)}
td select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;max-width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media (max-width:560px){.g2{grid-template-columns:1fr}}
.docpv{background:var(--soft);border-radius:10px;padding:18px;display:grid;place-items:center;min-height:260px;margin-bottom:12px}.docpv img{max-height:420px;border-radius:6px}
.docmock{background:var(--surface);width:min(420px,100%);padding:22px;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.08)}.mockline{height:8px;background:var(--line);border-radius:4px;margin:8px 0}
/* toast + demo */

.altw{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}

.altab th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}

.alst{display:inline-flex;gap:6px;align-items:center;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.alst i{width:8px;height:8px;border-radius:50%;background:var(--muted)}

.alfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}


.stabs2 button{padding:10px 10px;min-width:0;font-size:14.5px;gap:6px}.stabs2{gap:0}.stabs2 button.key{background:var(--accent-soft);color:var(--accent);border-radius:10px 10px 0 0;margin-left:6px;border-bottom-color:transparent}

.stabs2 button.key:hover{color:var(--accent);filter:brightness(.97)}
.stabs2 button.key[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-bottom-color:var(--accent)}
